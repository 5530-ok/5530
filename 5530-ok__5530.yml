name: 5530-ok/5530
category: tools
description:
  zh: "把 B 站视频下载、本地 whisper 转写、再用 DSH 自身 LLM 生成结构化 Markdown 笔记（并可转 PDF）的 agent 工具。提供 video_to_notes（下载视频→转写→生成笔记→落盘）与 note_to_pdf（把 Markdown 笔记转成 PDF）两个工具。转写依赖（whisper 二进制 + 模型 + yt-dlp + ffmpeg）自动检测、缺失时从国内镜像自动下载到数据目录，无需手动配置。纯 JS，用 DSH 自带 LLM 生成，无需额外 API key。"
  en: "Agent tools that download a Bilibili video, transcribe it locally with whisper, then generate a structured Markdown note with the DSH's own LLM (and optionally convert it to PDF). Provides two tools: video_to_notes (download → transcribe → generate note → save) and note_to_pdf (convert a Markdown note to PDF). Transcription dependencies (whisper binary + model + yt-dlp + ffmpeg) are auto-detected and, when missing, auto-downloaded from mirrors into the data directory. Pure JS; notes are generated by the built-in LLM, no extra API key required."
